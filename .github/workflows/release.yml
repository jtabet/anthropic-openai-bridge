name: Release

# Fires when a `v*` tag is pushed (e.g. v0.1.0, v1.2.3).
# Workflow: verify the build, then `npm publish` using Trusted Publishing
# (OIDC) — no NPM_TOKEN secret needed. The package on npm must have
# Trusted Publishing configured to trust this repo + workflow filename.
# See README → "Publishing a release".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # to create the GitHub Release
  id-token: write   # to mint the OIDC token npm verifies

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Node (required by npm publish for OIDC)
        uses: actions/setup-node@v7
        with:
          # Node 24+ ships npm 11.5.1+, which the npm registry requires for
          # OIDC trusted publishing. Node 22 ships npm 10.x and produces a
          # misleading E404 on PUT (see run 26780418451).
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install (frozen)
        run: bun install --frozen-lockfile

      - name: Verify
        run: |
          bun run lint
          bun run typecheck
          node node_modules/vitest/vitest.mjs run --coverage
          bun run build

      - name: Sanity-check tag matches package.json version
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Publish to npm with provenance (Trusted Publishing)
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
