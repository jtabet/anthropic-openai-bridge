name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write  # required for npm provenance via OIDC

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release via Changesets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Node (required for npm publish + OIDC)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install (frozen)
        run: bun install --frozen-lockfile

      - name: Full verification before any release action
        run: |
          bun run lint
          bun run typecheck
          node node_modules/vitest/vitest.mjs run --coverage
          bun run build

      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # Publishes via npm with provenance because publishConfig.provenance
          # is set in package.json and id-token: write is granted above.
          publish: bun x changeset publish
          version: bun x changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
